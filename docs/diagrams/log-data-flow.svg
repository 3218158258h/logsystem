<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">IPC 日志系统数据与控制流转</title>
<desc id="flow-desc">两个业务进程各自维护本地有界队列和发送线程，经 FDBus 上报到同一个日志服务；服务端共享队列、排序、格式化后写出两种 Sink。等级控制按实例调整 Logger。</desc>
