<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1180" viewBox="0 0 1640 1180">
<title>IPC日志系统架构图</title>
<desc>架构按进程和模块归属组织。业务侧多个进程各有Logger和FdbusLogTarget，与日志主进程直接通过FDBus通信。name_server仅承担注册与发现。日志主进程包含控制面、通信适配、日志核心和显示输出面。没有处理步骤或跨进程flush协议。</desc>
<rect width="1640" height="1180" fill="#f5f7fb"/>
<text x="54" y="57" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="44" font-weight="600" fill="#24354b">IPC 日志系统架构图</text>
<text x="56" y="108" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#62748b">进程边界 · 模块归属 · 通信关系</text>
<text x="1490" y="64" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#62748b">2026-10-28</text>
