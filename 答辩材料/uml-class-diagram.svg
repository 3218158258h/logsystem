t-weight="400" text-anchor="start">timestamp_ms / pid</text><text x="42" y="311" font-size="15.5" fill="#475569" font-weight="400" text-anchor="start">level / module / message</text><text x="42" y="334" font-size="16" fill="#475569" font-weight="400" text-anchor="start">sequence / instance</text></g><g class="class-box" data-box="LogLevel" data-x="30" data-y="405" data-w="210" data-h="90"><rect x="30" y="405" width="210" height="90" rx="7" fill="#fff8ee" stroke="#b7c8df" stroke-width="1.5"/><text x="42" y="433" font-size="21" fill="#243f64" font-weight="700" text-anchor="start">LogLevel</text><text x="42" y="458" font-size="16" fill="#475569" font-weight="400" text-anchor="start">DEBUG / INFO</text><text x="42" y="481" font-size="16" fill="#475569" font-weight="400" text-anchor="start">WARN / ERROR</text></g><rect x="300" y="220" width="230" height="280" rx="7" fill="#fff" stroke="#9fb7d7" stroke-width="1.5"/><text x="313" y="248" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">FdbusLogTarget</text><text x="313" y="273" font-size="18" fill="#334155" font-weight="400" text-anchor="start">submit(record)</text><text x="313" y="296" font-size="15.5" fill="#334155" font-weight="400" text-anchor="start">shutdown / attachLogger</text><text x="313" y="320" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">impl_ 持有队列与发送线程</text><g class="class-box" data-box="queue_" data-x="310" data-y="355" data-w="210" data-h="92"><rect x="310" y="355" width="210" height="92" rx="7" fill="#f8fbff" stroke="#b7c8df" stroke-width="1.5"/><text x="322" y="383" font-size="16" fill="#243f64" font-weight="700" text-anchor="start">queue_: BoundedQueue</text><text x="322" y="408" font-size="16" fill="#475569" font-weight="400" text-anchor="start">&lt;LogRecord&gt;</text><text x="322" y="431" font-size="16" fill="#475569" font-weight="400" text-anchor="start">tryPush() / waitPop()</text></g><text x="313" y="477" font-size="17" fill="#475569" font-weight="400" text-anchor="start">sender_: 发送线程</text><path d="M240,125 H300" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M135,185 V235" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="145" y="217" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">«create»</text><path d="M135,365 V405" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="145" y="390" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">level</text><path d="M415,220 V180" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#triangle)"/><text x="430" y="205" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">实现</text><path d="M240,300 H300" fill="none" stroke="#4472c4" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="270" y="289" font-size="15" fill="#4472c4" font-weight="400" text-anchor="middle">record</text><path d="M415,327 V355" fill="none" stroke="#4472c4" stroke-width="1.7" marker-end="url(#blue-arrow)"/><text x="427" y="344" font-size="14" fill="#4472c4" font-weight="400" text-anchor="start">tryPush</text><g class="class-box" data-box="LogServer / Impl" data-x="755" data-y="85" data-w="240" data-h="420"><rect x="755" y="85" width="240" height="420" rx="7" fill="#fff" stroke="#b7c8df" stroke-width="1.5"/><text x="767" y="113" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">LogServer / Impl</text><text x="767" y="138" font-size="17" fill="#475569" font-weight="400" text-anchor="start">start() / shutdown()</text><text x="767" y="161" font-size="17" fill="#475569" font-weight="400" text-anchor="start">listWorkers()</text><text x="767" y="184" font-size="17" fill="#475569" font-weight="400" text-anchor="start">setWorkerLevel()</text><text x="767" y="207" font-size="12.8" fill="#475569" font-weight="400" text-anchor="start">sessions_: map&lt;sid, ProcessState&gt;</text></g><text x="875" y="249" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">会话条目示意（0..*）</text><g class="class-box" data-box="info : WorkerInfo (A)" data-x="770" data-y="270" data-w="210" data-h="85"><rect x="770" y="270" width="210" height="85" rx="7" fill="#f8fbff" stroke="#b7c8df" stroke-width="1.5"/><text x="782" y="298" font-size="16" fill="#243f64" font-weight="700" text-anchor="start">info : WorkerInfo (A)</text><text x="782" y="323" font-size="16" fill="#475569" font-weight="400" text-anchor="start">pid / instance</text><text x="782" y="346" font-size="16" fill="#475569" font-weight="400" text-anchor="start">level / status</text></g><g class="class-box" data-box="info : WorkerInfo (B)" data-x="770" data-y="370" data-w="210" data-h="85"><rect x="770" y="370" width="210" height="85" rx="7" fill="#f8fbff" stroke="#b7c8df" stroke-width="1.5"/><text x="782" y="398" font-size="16" fill="#243f64" font-weight="700" text-anchor="start">info : WorkerInfo (B)</text><text x="782" y="423" font-size="16" fill="#475569" font-weight="400" text-anchor="start">pid / instance</text><text x="782" y="446" font-size="16" fill="#475569" font-weight="400" text-anchor="start">level / status</text></g><text x="875" y="485" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">每项另含 last_seen_sequence</text><rect x="1035" y="85" width="250" height="230" rx="7" fill="#fff" stroke="#7fa6d8" stroke-width="1.5"/><text x="1047" y="113" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">LogAggregator</text><text x="1047" y="138" font-size="16" fill="#334155" font-weight="400" text-anchor="start">submit(record) / shutdown()</text><text x="1047" y="161" font-size="17" fill="#334155" font-weight="400" text-anchor="start">run() / outputReady()</text><g class="class-box" data-box="queue_: BoundedQueue" data-x="1050" data-y="206" data-w="220" data-h="88"><rect x="1050" y="206" width="220" height="88" rx="7" fill="#f8fbff" stroke="#b7c8df" stroke-width="1.5"/><text x="1062" y="234" font-size="16" fill="#243f64" font-weight="700" text-anchor="start">queue_: BoundedQueue</text><text x="1062" y="259" font-size="16" fill="#475569" font-weight="400" text-anchor="start">&lt;LogRecord&gt;</text><text x="1062" y="282" font-size="16" fill="#475569" font-weight="400" text-anchor="start">tryPush / waitPopFor</text></g><path d="M1160,170 V206" fill="none" stroke="#4472c4" stroke-width="1.7" marker-end="url(#blue-arrow)"/><text x="1173" y="192" font-size="14" fill="#4472c4" font-weight="400" text-anchor="start">tryPush</text><g class="class-box" data-box="ReorderBuffer" data-x="1035" data-y="355" data-w="250" data-h="100"><rect x="1035" y="355" width="250" height="100" rx="7" fill="#fff" stroke="#b7c8df" stroke-width="1.5"/><text x="1047" y="383" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">ReorderBuffer</text><text x="1047" y="408" font-size="17" fill="#475569" font-weight="400" text-anchor="start">add() / releaseReady()</text><text x="1047" y="431" font-size="17" fill="#475569" font-weight="400" text-anchor="start">按时间戳维护记录</text></g><g class="class-box" data-box="LogFormatter" data-x="1035" data-y="505" data-w="250" data-h="75"><rect x="1035" y="505" width="250" height="75" rx="7" fill="#fff" stroke="#b7c8df" stroke-width="1.5"/><text x="1047" y="533" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">LogFormatter</text><text x="1047" y="558" font-size="18" fill="#475569" font-weight="400" text-anchor="start">format(record)</text></g><g class="class-box" data-box="ILogSink" data-x="1325" data-y="135" data-w="205" data-h="100"><rect x="1325" y="135" width="205" height="100" rx="7" fill="#eaf1fb" stroke="#b7c8df" stroke-width="1.5"/><text x="1337" y="154" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">«interface»</text><text x="1337" y="179" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">ILogSink</text><text x="1337" y="204" font-size="17" fill="#475569" font-weight="400" text-anchor="start">write() / flush()</text></g><g class="class-box" data-box="ConsoleSink" data-x="1325" data-y="315" data-w="205" data-h="100"><rect x="1325" y="315" width="205" height="100" rx="7" fill="#fff" stroke="#b7c8df" stroke-width="1.5"/><text x="1337" y="343" font-size="22" fill="#243f64" font-weight="700" text-anchor="start">ConsoleSink</text><text x="1337" y="368" font-size="17" fill="#475569" font-weight="400" text-anchor="start">ERROR → stderr</text><text x="1337" y="391" font-size="17" fill="#475569" font-weight="400" text-anchor="start">其他 → stdout</text></g><g class="class-box" data-box="RotatingFileSink" data-x="1325" data-y="475" data-w="205" data-h="100"><rect x="1325" y="475" width="205" height="100" rx="7" fill="#fff" stroke="#b7c8df" stroke-width="1.5"/><text x="1337" y="503" font-size="21" fill="#243f64" font-weight="700" text-anchor="start">RotatingFileSink</text><text x="1337" y="528" font-size="17" fill="#475569" font-weight="400" text-anchor="start">write() / rotate()</text><text x="1337" y="551" font-size="17" fill="#475569" font-weight="400" text-anchor="start">按大小轮转</text></g><path d="M875,85 V72 H1160 V85" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1020" y="66" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">aggregator_ / submit(record)</text><path d="M1235,85 V51 H500 V75" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#triangle)"/><text x="625" y="43" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">实现 ILogTarget</text><path d="M1160,315 V355" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#diamond)"/><text x="1172" y="341" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">reorder_</text><path d="M1035,180 H1015 V542 H1035" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="925" y="532" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">调用 format(record)</text><path d="M1285,185 H1325" fill="none" stroke="#64748b" stroke-width="1.7" marker-start="url(#hollow)"/><text x="1305" y="173" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">2</text><path d="M1427,315 V235" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#triangle)"/><path d="M1325,525 H1305 V275 H1480 V235" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#triangle)"/><path d="M530,245 H755" fill="none" stroke="#4472c4" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="642" y="234" font-size="17" fill="#4472c4" font-weight="600" text-anchor="middle">LogRecord 上报</text><path d="M755,285 H530" fill="none" stroke="#4472c4" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="642" y="274" font-size="17" fill="#4472c4" font-weight="600" text-anchor="middle">LogReply / ACK</text><path d="M755,330 H530" fill="none" stroke="#c47b30" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#orange-arrow)" marker-start="url(#orange-arrow)"/><text x="642" y="320" font-size="16" fill="#b07331" font-weight="400" text-anchor="middle">等级控制请求 / 回复</text><text x="24" y="631" font-size="15" fill="#596d88" font-weight="400" text-anchor="start">人工核对：嵌套框表示成员归属；灰线为类关系，蓝线为记录/消息；ACK 确认汇聚入队；WorkerInfo A/B 为多会话条目示意。</text></svg>
