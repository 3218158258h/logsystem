<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="640" viewBox="0 0 1560 640" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" aria-labelledby="uml-title uml-desc">
<title id="uml-title">日志系统核心类、成员归属与消息关系</title><desc id="uml-desc">Logger 构造 LogRecord 并调用 ILogTarget 提交。客户端目标的 Impl 持有本地队列。LogServer 持有多条包含 WorkerInfo 的会话状态，并调用汇聚器 submit；汇聚器内部通过 tryPush 入队。日志上报与 ACK 分别画出。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4472c4"/></marker>
<marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#c47b30" stroke-width="1.5"/></marker>
<marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#fff" stroke="#64748b" stroke-width="1.3"/></marker>
<marker id="diamond" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 6 L6 1 L11 6 L6 11 Z" fill="#64748b"/></marker>
<marker id="hollow" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 6 L6 1 L11 6 L6 11 Z" fill="#fff" stroke="#64748b" stroke-width="1.2"/></marker>
</defs>
<rect width="1560" height="640" fill="#fff"/>
