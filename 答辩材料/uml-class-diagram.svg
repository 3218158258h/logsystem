<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" font-family="'Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="none" stroke="#64748B" stroke-width="1.3"/>
    </marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    </marker>
    <marker id="diam" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="#ED7D31" stroke="#ED7D31"/>
    </marker>
    <marker id="hdiam" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ===== 进程容器 ===== -->
  <rect x="20" y="45" width="450" height="640" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="40" y="80" font-size="16" font-weight="700" fill="#475569">业务进程（worker：demo-a / demo-b）</text>

  <rect x="680" y="45" width="700" height="640" rx="12" fill="#EAF1FB" stroke="#4472C4" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="700" y="80" font-size="16" font-weight="700" fill="#1E293B">日志主进程（log_server：svc://ipc_log_service）</text>

  <!-- ===== 关系线 ===== -->
  <g fill="none" stroke="#64748B" stroke-width="1.3">
    <!-- worker 内部 -->
    <line x1="235" y1="145" x2="259" y2="145" marker-end="url(#arr)"/>
    <line x1="140" y1="205" x2="140" y2="249" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <line x1="140" y1="370" x2="140" y2="409" marker-end="url(#arr)"/>
    <line x1="355" y1="235" x2="355" y2="186" stroke-dasharray="5 4" marker-end="url(#tri)"/>
    <line x1="355" y1="355" x2="355" y2="394" marker-start="url(#diam)"/>

    <!-- FDBus 通信 -->
    <line x1="450" y1="275" x2="704" y2="275" marker-end="url(#arr)"/>
    <line x1="704" y1="315" x2="450" y2="315" stroke-dasharray="5 4" marker-end="url(#arr)"/>

    <!-- server 内部 -->
    <line x1="895" y1="285" x2="924" y2="285" marker-end="url(#arr)"/>
    <line x1="800" y1="355" x2="800" y2="394" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <line x1="1020" y1="355" x2="1020" y2="394" marker-start="url(#diam)"/>
    <line x1="1115" y1="285" x2="1139" y2="285" marker-start="url(#diam)"/>
    <path d="M1115,310 L1128,310 L1128,400 L1139,400" marker-start="url(#hdiam)"/>
    <line x1="1235" y1="485" x2="1235" y2="441" stroke-dasharray="5 4" marker-end="url(#tri)"/>
    <path d="M1140,625 L1122,625 L1122,400 L1139,400" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  </g>

  <!-- 标签 -->
  <g font-size="11" fill="#64748B">
    <text x="240" y="137">target_</text>
    <text x="146" y="230">构造</text>
    <text x="146" y="392">level</text>
    <text x="357" y="375">queue_</text>
    <text x="480" y="267">数据面：LogRecord（上报）· LogReply（ACK）</text>
    <text x="480" y="330">控制面：LevelControlRequest / Reply</text>
    <text x="898" y="277">aggregator_</text>
    <text x="806" y="377">produces</text>
    <text x="1118" y="277">queue_</text>
  </g>

  <!-- ===== 类框 ===== -->
  <g>
    <!-- 业务进程：Logger -->
    <rect x="45" y="100" width="190" height="105" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="59" y="126" font-size="15" font-weight="700" fill="#1E293B">Logger</text>
    <text x="59" y="150" font-size="12.5" fill="#475569">log() · setLevel()</text>
    <text x="59" y="172" font-size="12.5" fill="#475569">stats()</text>
    <text x="59" y="193" font-size="11" fill="#94A3B8">threshold_(atomic)</text>

    <!-- 业务进程：LogRecord -->
    <rect x="45" y="250" width="190" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="59" y="276" font-size="15" font-weight="700" fill="#1E293B">LogRecord</text>
    <text x="59" y="300" font-size="12.5" fill="#475569">timestamp_ms · level · pid</text>
    <text x="59" y="321" font-size="12.5" fill="#475569">module · message</text>
    <text x="59" y="342" font-size="12.5" fill="#475569">sequence · instance</text>

    <!-- 业务进程：LogLevel -->
    <rect x="45" y="410" width="190" height="70" rx="8" fill="#FFF7F0" stroke="#ED7D31" stroke-width="1.5"/>
    <text x="59" y="436" font-size="15" font-weight="700" fill="#1E293B">«enum» LogLevel</text>
    <text x="59" y="460" font-size="12.5" fill="#475569">DEBUG · INFO · WARN · ERROR</text>

    <!-- 业务进程：ILogTarget -->
    <rect x="260" y="100" width="190" height="85" rx="8" fill="#EAF1FB" stroke="#4472C4" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="274" y="126" font-size="15" font-weight="700" font-style="italic" fill="#1E293B">«interface» ILogTarget</text>
    <text x="274" y="150" font-size="12.5" fill="#475569">submit() · shutdown()</text>
    <text x="274" y="171" font-size="12.5" fill="#475569">stats()</text>

    <!-- 业务进程：FdbusLogTarget -->
    <rect x="260" y="235" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="274" y="261" font-size="15" font-weight="700" fill="#1E293B">FdbusLogTarget</text>
    <text x="274" y="285" font-size="12.5" fill="#475569">submit() · shutdown()</text>
    <text x="274" y="306" font-size="12.5" fill="#475569">attachLogger()</text>
    <text x="274" y="327" font-size="11" fill="#94A3B8">本地队列 + 发送线程</text>

    <!-- 业务进程：BoundedQueue -->
    <rect x="260" y="395" width="190" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="274" y="421" font-size="15" font-weight="700" fill="#1E293B">BoundedQueue&lt;T&gt;</text>
    <text x="274" y="445" font-size="12.5" fill="#475569">tryPush() · waitPop()</text>
    <text x="274" y="466" font-size="12.5" fill="#475569">close()</text>

    <!-- 主进程：LogServer -->
    <rect x="705" y="235" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="719" y="261" font-size="15" font-weight="700" fill="#1E293B">LogServer</text>
    <text x="719" y="285" font-size="12.5" fill="#475569">start() · shutdown()</text>
    <text x="719" y="306" font-size="12.5" fill="#475569">listWorkers() · setWorkerLevel()</text>
    <text x="719" y="327" font-size="11" fill="#94A3B8">校验 + 会话管理</text>

    <!-- 主进程：WorkerInfo -->
    <rect x="705" y="395" width="190" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="719" y="421" font-size="15" font-weight="700" fill="#1E293B">WorkerInfo</text>
    <text x="719" y="445" font-size="12.5" fill="#475569">session_id · process_instance</text>
    <text x="719" y="466" font-size="12.5" fill="#475569">pid · level · status</text>

    <!-- 主进程：LogAggregator -->
    <rect x="925" y="235" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#4472C4" stroke-width="1.5"/>
    <text x="939" y="261" font-size="15" font-weight="700" fill="#1E293B">LogAggregator</text>
    <text x="939" y="285" font-size="12.5" fill="#475569">submit() · shutdown()</text>
    <text x="939" y="306" font-size="12.5" fill="#475569">run() · outputReady()</text>
    <text x="939" y="327" font-size="11" fill="#94A3B8">单消费线程</text>

    <!-- 主进程：ReorderBuffer -->
    <rect x="925" y="395" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="939" y="421" font-size="15" font-weight="700" fill="#1E293B">ReorderBuffer</text>
    <text x="939" y="445" font-size="12.5" fill="#475569">add() · releaseReady()</text>
    <text x="939" y="466" font-size="11" fill="#94A3B8">窗口50ms / 容量4096</text>

    <!-- 主进程：LogFormatter -->
    <rect x="925" y="525" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="939" y="551" font-size="15" font-weight="700" fill="#1E293B">LogFormatter</text>
    <text x="939" y="575" font-size="12.5" fill="#475569">format(LogRecord)</text>

    <!-- 主进程：BoundedQueue -->
    <rect x="1140" y="235" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1154" y="261" font-size="15" font-weight="700" fill="#1E293B">BoundedQueue&lt;T&gt;</text>
    <text x="1154" y="285" font-size="12.5" fill="#475569">tryPush() · waitPop()</text>
    <text x="1154" y="306" font-size="12.5" fill="#475569">close()</text>

    <!-- 主进程：ILogSink -->
    <rect x="1140" y="360" width="190" height="80" rx="8" fill="#EAF1FB" stroke="#4472C4" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="1154" y="386" font-size="15" font-weight="700" font-style="italic" fill="#1E293B">«interface» ILogSink</text>
    <text x="1154" y="410" font-size="12.5" fill="#475569">write() · flush()</text>

    <!-- 主进程：ConsoleSink -->
    <rect x="1140" y="485" width="190" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1154" y="511" font-size="15" font-weight="700" fill="#1E293B">ConsoleSink</text>
    <text x="1154" y="535" font-size="12.5" fill="#475569">ERROR→stderr · 其余→stdout</text>

    <!-- 主进程：RotatingFileSink -->
    <rect x="1140" y="595" width="190" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1154" y="621" font-size="15" font-weight="700" fill="#1E293B">RotatingFileSink</text>
    <text x="1154" y="645" font-size="12.5" fill="#475569">write() · rotate()</text>
  </g>

  <!-- 共享定义说明 -->
  <text x="470" y="705" font-size="12" fill="#94A3B8">共享定义（include/ipc_log，两端各自编译实例化）：LogRecord · LogLevel · ILogTarget · BoundedQueue&lt;T&gt;</text>
</svg>
